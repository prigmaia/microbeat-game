<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroBeat: Batalha Online</title>
    <style>
        :root {
            --p1-color: #00d2ff;
            --p2-color: #ff0055;
            --neon-green: #a8ff78;
            --neon-orange: #ff7e00;
        }

        body {
            margin: 0; padding: 0;
            background-image: url('Gemini_Generated_Image_y1cw6gy1cw6gy1cw.png');
            background-size: 100% 100%; background-position: center bottom;
            background-repeat: no-repeat; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; overflow: hidden; user-select: none;
            background-color: #050505;
        }

        #signature {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 1rem;
            color: rgba(255, 255, 255, 0.6); z-index: 1000; pointer-events: none; letter-spacing: 2px; text-transform: uppercase;
        }
        #signature span { color: var(--p1-color); font-weight: bold; text-shadow: 0 0 10px var(--p1-color); }

        /* UI DO JOGADOR LOCAL (P1) */
        .p1-ui { position: absolute; left: 20px; color: var(--p1-color); }
        #p1-score-panel { top: 60px; width: 250px; background: radial-gradient(circle, rgba(5,10,15,0.9) 40%, rgba(5,10,15,0) 100%); padding: 20px; }
        .score-val { font-size: 3rem; font-weight: bold; text-shadow: 0 0 15px currentColor; line-height: 1.1; }
        .mult-val { font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px currentColor; }
        
        #p1-combo-panel { top: 220px; text-align: center; }
        .combo-circle { width: 100px; height: 100px; border-radius: 50%; border: 4px solid currentColor; background: #0a0a0a; box-shadow: 0 0 15px currentColor, inset 0 0 10px currentColor; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: 10px; }
        .combo-val { font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px currentColor; }
        
        #p1-special-panel { bottom: 30px; width: 250px; background: rgba(10, 15, 25, 0.9); border: 2px solid var(--p1-color); border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .special-bar-bg { width: 100%; height: 25px; background: #111; border: 2px solid #333; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .special-bar-fill { width: 0%; height: 100%; transition: width 0.1s; }
        #p1-special-fill { background: linear-gradient(90deg, #0055ff, var(--p1-color), #fff); box-shadow: 0 0 15px var(--p1-color); }
        
        /* UI DO OPONENTE (P2 ONLINE) */
        .p2-ui { position: absolute; right: 20px; color: var(--p2-color); text-align: right; display: none; }
        #p2-score-panel { top: 60px; width: 250px; background: radial-gradient(circle, rgba(15,5,5,0.9) 40%, rgba(15,5,5,0) 100%); padding: 20px; }
        #p2-combo-panel { top: 220px; display: flex; flex-direction: column; align-items: flex-end; }

        .special-ready { animation: pulse-special 0.5s infinite alternate; }
        @keyframes pulse-special { 0% { box-shadow: 0 0 10px currentColor; } 100% { box-shadow: 0 0 30px currentColor, 0 0 15px #fff; } }

        /* MENSAGEM DE REDE */
        #network-status { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font-size: 2rem; color: #ffcc00; font-weight: bold; text-shadow: 0 0 20px #ff0000; z-index: 1000; display: none; text-transform: uppercase; background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 10px; border: 2px solid #ffcc00; }

        /* TELA DE SOFRIMENTO (QUANDO OPONENTE USA ESPECIAL) */
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.4); z-index: 800; display: none; pointer-events: none; animation: shake 0.3s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }

        /* MENU DE CONFIGURAÇÃO */
        #config-panel { position: absolute; bottom: 20px; left: 20px; width: 340px; background: rgba(5, 10, 15, 0.95); border: 1px solid var(--p1-color); padding: 15px; border-radius: 8px; z-index: 100; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.3); }
        .config-section h4 { margin: 0 0 5px 0; font-size: 0.85rem; color: var(--p1-color); text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
        .btn-toggle { flex: 1; background: #111; color: #aaa; border: 1px solid #333; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; transition: 0.2s; }
        .btn-toggle.active { background: var(--p1-color); color: #000; border-color: var(--p1-color); font-weight: bold; }
        .key-input { width: 25px; height: 25px; background: #111; color: #fff; border: 1px solid #555; border-radius: 4px; text-align: center; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; }
        .input-text { background: #111; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; flex: 1; font-size: 0.8rem; }
        .btn-action { background: var(--p1-color); color: #000; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        #btn-open-config { position: absolute; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.8); border: 2px solid var(--p1-color); color: var(--p1-color); padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 90; display: none; }

        /* DIFICULDADE */
        #difficulty-panel { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; background: rgba(0, 0, 0, 0.85); padding: 8px 15px; border-radius: 10px; border: 1px solid var(--p1-color); }

        /* A PISTA DO JOGO (ARENA SPLIT SCREEN) */
        #arena { position: absolute; bottom: 180px; width: 100%; display: flex; justify-content: center; gap: 50px; pointer-events: none; }
        .highway-wrapper { perspective: 300px; width: 500px; height: 60vh; display: flex; justify-content: center; align-items: flex-end; }
        canvas { transform: rotateX(60deg); transform-origin: bottom center; background: rgba(5, 7, 10, 0.95); width: 100%; height: 100%; box-shadow: 0 -40px 80px rgba(0, 0, 0, 1) inset; }
        #canvas1 { border-left: 8px solid var(--p1-color); border-right: 8px solid var(--p1-color); }
        #canvas2 { border-left: 8px solid var(--p2-color); border-right: 8px solid var(--p2-color); display: none;}

        #yt-player-container { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="signature">by: <span>Priscila Maia</span></div>
    <div id="yt-player-container"><div id="yt-player"></div></div>
    
    <div id="network-status">Aguardando Oponente...</div>
    <div id="damage-overlay"></div> <!-- Efeito visual de dano na tela -->

    <div id="difficulty-panel">
        <button class="btn-toggle" onclick="setDifficulty('Fácil')">Fácil</button>
        <button class="btn-toggle active" onclick="setDifficulty('Médio')">Médio</button>
        <button class="btn-toggle" onclick="setDifficulty('Difícil')">Difícil</button>
        <button class="btn-toggle" onclick="setDifficulty('Expert')">Expert</button>
    </div>

    <button id="btn-open-config" onclick="openConfigMenu()">⚙️ Menu</button>

    <div id="config-panel">
        <div class="config-section">
            <h4>🌐 Servidor Multiplayer</h4>
            <div class="row">
                <!-- Exemplo de URL. O jogador cola o wss:// gerado no Render aqui -->
                <input type="text" class="input-text" id="wsUrlInput" placeholder="wss://microbeat-server.onrender.com" value="">
            </div>
        </div>
        <div class="config-section">
            <h4>👥 Modo de Jogo</h4>
            <div class="row">
                <button id="btn-solo" class="btn-toggle active" onclick="setOnlineMode(false)">Solo</button>
                <button id="btn-online" class="btn-toggle" onclick="setOnlineMode(true)" style="background: var(--p2-color); border-color: var(--p2-color); color: #fff;">Batalha Online!</button>
            </div>
        </div>
        <div class="config-section">
            <h4>⌨️ Minhas Teclas</h4>
            <div class="row" style="margin-bottom: 5px;">
                <input type="text" class="key-input" id="k1-0" value="A" maxlength="1"><input type="text" class="key-input" id="k1-1" value="S" maxlength="1"><input type="text" class="key-input" id="k1-2" value="D" maxlength="1"><input type="text" class="key-input" id="k1-3" value="J" maxlength="1"><input type="text" class="key-input" id="k1-4" value="K" maxlength="1">
            </div>
        </div>
        <div class="config-section">
            <h4>🎵 Áudio</h4>
            <div class="row">
                <input type="number" class="input-text" id="bpmInput" value="120" min="40" max="300" style="flex: 0.3;">
                <input type="text" class="input-text" id="ytUrlInput" placeholder="URL YouTube...">
                <button class="btn-action" onclick="carregarEPreparar()">Jogar / Buscar</button>
            </div>
        </div>
    </div>

    <!-- UI JOGADOR 1 (LOCAL) -->
    <div id="p1-score-panel" class="p1-ui">
        <div id="p1-score" class="score-val">0</div>
        <div id="p1-mult" class="mult-val">X1</div>
    </div>
    <div id="p1-combo-panel" class="p1-ui">
        <b>MEU COMBO</b>
        <div class="combo-circle"><div id="p1-combo" class="combo-val">0</div></div>
    </div>
    <div id="p1-special-panel" class="p1-ui">
        <div style="font-weight: bold; letter-spacing: 1px;">ATACAR OPONENTE (ESPAÇO)</div>
        <div class="special-bar-bg"><div id="p1-special-fill" class="special-bar-fill"></div></div>
    </div>

    <!-- UI JOGADOR 2 (ONLINE) -->
    <div id="p2-score-panel" class="p2-ui">
        <div style="font-size: 1rem; color: #fff;">OPONENTE</div>
        <div id="p2-score" class="score-val">0</div>
    </div>
    <div id="p2-combo-panel" class="p2-ui">
        <b>COMBO OPONENTE</b>
        <div class="combo-circle"><div id="p2-combo" class="combo-val">0</div></div>
    </div>

    <!-- ARENA -->
    <div id="arena">
        <div class="highway-wrapper"><canvas id="canvas1" width="600" height="1000"></canvas></div>
        <div class="highway-wrapper" id="wrap-p2" style="display:none;"><canvas id="canvas2" width="600" height="1000"></canvas></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const numLanes = 5;
        const hitZoneY = 880; 
        let isPlaying = false;
        let isOnline = false;
        let socket = null;
        let p2ActiveLanes = [false, false, false, false, false];
        
        let bpm = 120;
        let baseBeatSec = 60 / bpm; 
        let speedFactor = 800; 
        let hitWindow = 0.15; 
        let beatMultiplier = 1; 
        let holdProb = 0.15;    
        let chordProb = 0.05;    
        let maxChordNotes = 2; 

        let nextBeatTime = 0;
        let lookAheadTime = 2.5; 
        let firstBeatInitialized = false;

        const laneConfig = [
            { color: '#ff7e00', type: 'bacilo' }, { color: '#00ffcc', type: 'virus' }, 
            { color: '#ff0055', type: 'sauron' }, { color: '#a8ff78', type: 'bacilo' }, { color: '#b829ff', type: 'virus' }  
        ];

        let notes = []; 
        let laneOccupiedUntil = [0, 0, 0, 0, 0]; 

        class Player {
            constructor(id, canvasId, color) {
                this.id = id;
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.laneWidth = this.canvas.width / numLanes;
                this.color = color;
                
                this.keys = [];
                this.activeKeys = [false, false, false, false, false];
                
                this.score = 0; this.combo = 0; this.mult = 1;
                this.propulsion = 0; this.isPropActive = false;
                this.fretOffset = 0;
                this.hitEffects = [];
                
                this.uiScore = document.getElementById(`p${id}-score`);
                this.uiCombo = document.getElementById(`p${id}-combo`);
                if (id === 1) {
                    this.uiMult = document.getElementById(`p1-mult`);
                    this.uiPropFill = document.getElementById(`p1-special-fill`);
                    this.uiPropPanel = document.getElementById(`p1-special-panel`);
                }
            }

            updateKeysConfig() {
                for(let i=0; i<5; i++) {
                    let val = document.getElementById(`k1-${i}`).value.toLowerCase();
                    this.keys[i] = val || this.keys[i];
                }
            }

            reset() {
                this.score = 0; this.combo = 0; this.mult = 1;
                this.propulsion = 0; this.isPropActive = false;
                this.hitEffects = [];
                this.updateUI();
            }

            updateUI() {
                this.uiScore.innerText = this.score.toLocaleString('en-US');
                this.uiCombo.innerText = this.combo;
                if (this.id === 1) {
                    this.uiMult.innerText = 'X' + (this.isPropActive ? this.mult * 2 : this.mult);
                    this.uiPropFill.style.width = this.propulsion + '%';
                    if (this.propulsion >= 100 && !this.isPropActive) {
                        this.uiPropPanel.classList.add('special-ready');
                    } else {
                        this.uiPropPanel.classList.remove('special-ready');
                    }
                }
            }
        }

        const p1 = new Player(1, 'canvas1', '#00d2ff');
        const p2 = new Player(2, 'canvas2', '#ff0055');

        // --- SISTEMA DE WEBSOCKETS (MULTI ONLINE) ---
        const netStatus = document.getElementById('network-status');
        const damageOverlay = document.getElementById('damage-overlay');

        function setOnlineMode(online) {
            isOnline = online;
            document.getElementById('btn-solo').classList.toggle('active', !online);
            document.getElementById('btn-online').classList.toggle('active', online);
            
            document.getElementById('wrap-p2').style.display = online ? 'flex' : 'none';
            document.querySelectorAll('.p2-ui').forEach(el => el.style.display = online ? 'block' : 'none');
        }

        function carregarEPreparar() {
            p1.updateKeysConfig();
            
            // Pega os dados do áudio do menu
            const vidId = extractVideoId(document.getElementById('ytUrlInput').value);
            bpm = parseInt(document.getElementById('bpmInput').value) || 120;
            baseBeatSec = 60/bpm;

            if (isOnline) {
                // Inicia conexão WebSocket em vez de tocar direto
                const wsUrl = document.getElementById('wsUrlInput').value.trim();
                if (!wsUrl || !wsUrl.startsWith("wss://")) {
                    alert("Para jogar online, cole a URL do seu servidor Render (wss://...)");
                    return;
                }
                
                document.getElementById('config-panel').style.display = 'none';
                netStatus.style.display = 'block';
                netStatus.innerText = "Conectando ao Servidor...";
                
                conectarWebSocket(wsUrl, vidId);
            } else {
                // Modo Solo: Toca imediatamente
                if(vidId) {
                    ytPlayer.loadVideoById(vidId); ytPlayer.playVideo();
                }
                startGameLocal();
            }
        }

        function conectarWebSocket(wsUrl, vidId) {
            if (socket) socket.close();
            
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function() {
                netStatus.innerText = "Aguardando Oponente na Sala...";
            };
            
            socket.onmessage = function(event) {
                const dados = JSON.parse(event.data);
                
                if (dados.acao === "START") {
                    netStatus.innerText = "OPONENTE ENCONTRADO! 3... 2... 1...";
                    setTimeout(() => {
                        netStatus.style.display = 'none';
                        if(vidId) { ytPlayer.loadVideoById(vidId); ytPlayer.playVideo(); }
                        startGameLocal();
                    }, 3000); // Dá 3 segundos para respirar antes da música começar
                }
                
                if (dados.acao === "WAIT") {
                    netStatus.innerText = "Aguardando oponente...";
                }

                if (dados.acao === "DISCONNECT") {
                    alert("O oponente se desconectou/fugiu!");
                    openConfigMenu();
                }

                // Recebendo as ações do Oponente
                if (dados.acao === "HIT") {
                    p2.score = dados.score;
                    p2.combo = dados.combo;
                    p2.updateUI();
                    p2.hitEffects.push({t: 'HIT!', x: (dados.lane * p2.laneWidth)+(p2.laneWidth/2), y: hitZoneY-60, c: p2.color, l: 15});
                    
                    // Simula o clique do laser rápido na pista dele para ficar legal visualmente
                    p2ActiveLanes[dados.lane] = true;
                    setTimeout(() => { p2ActiveLanes[dados.lane] = false; }, 100);
                }

                if (dados.acao === "MISS") {
                    p2.combo = 0; p2.updateUI();
                    p2.hitEffects.push({t: 'MISS', x: (dados.lane * p2.laneWidth)+(p2.laneWidth/2), y: hitZoneY-60, c: '#ff0000', l: 15});
                }

                if (dados.acao === "SPECIAL") {
                    // OPONENTE ATACOU VOCÊ! Treme e escurece sua tela
                    damageOverlay.style.display = 'block';
                    setTimeout(() => { damageOverlay.style.display = 'none'; }, 3000); // 3 Segundos de cegueira
                }
            };
            
            socket.onerror = function(error) {
                alert("Erro ao conectar no servidor. A URL está correta e o servidor está rodando?");
                openConfigMenu();
            };
        }

        function enviarRede(dados) {
            if (isOnline && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(dados));
            }
        }

        // --- SISTEMA LOCAL ---
        function setDifficulty(level) {
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText === level) btn.classList.add('active');
            });
            if (level === 'Fácil') { speedFactor = 500; hitWindow = 0.20; beatMultiplier = 2; holdProb = 0; chordProb = 0; maxChordNotes = 1; } 
            else if (level === 'Médio') { speedFactor = 800; hitWindow = 0.15; beatMultiplier = 1; holdProb = 0.15; chordProb = 0.05; maxChordNotes = 2; } 
            else if (level === 'Difícil') { speedFactor = 1300; hitWindow = 0.08; beatMultiplier = 0.5; holdProb = 0.30; chordProb = 0.30; maxChordNotes = 2; } 
            else if (level === 'Expert') { speedFactor = 1900; hitWindow = 0.04; beatMultiplier = 0.25; holdProb = 0.50; chordProb = 0.60; maxChordNotes = 4; }
        }

        function startGameLocal() {
            document.getElementById('config-panel').style.display = 'none';
            document.getElementById('btn-open-config').style.display = 'block';
            netStatus.style.display = 'none';
            notes = []; laneOccupiedUntil = [0,0,0,0,0];
            p1.reset(); p2.reset();
            isPlaying = true; firstBeatInitialized = false;
        }

        function openConfigMenu() {
            isPlaying = false; 
            if(socket) socket.close();
            if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            document.getElementById('btn-open-config').style.display = 'none';
            document.getElementById('config-panel').style.display = 'flex';
            netStatus.style.display = 'none';
            damageOverlay.style.display = 'none';
        }

        // ÁUDIO & YOUTUBE
        let ytPlayer; let isYtReady = false;
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', { height: '1', width: '1', events: { 'onReady': () => isYtReady = true }});
        }
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp); return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
        }
        function getAudioTime() {
            if (!isPlaying) return 0;
            return (ytPlayer && ytPlayer.getCurrentTime) ? ytPlayer.getCurrentTime() : 0;
        }

        // RENDERIZAÇÃO
        function drawShape(ctx, type, x, y, color) {
            ctx.fillStyle = color; ctx.shadowColor = color;
            if (type === 'bacilo') {
                ctx.shadowBlur = 15; ctx.beginPath(); ctx.ellipse(x, y, 18, 40, Math.PI/4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.ellipse(x, y, 6, 18, Math.PI/4, 0, Math.PI*2); ctx.fill();
            } else if (type === 'virus') {
                ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = color; ctx.lineWidth = 5;
                for(let i=0; i<8; i++) { let a = (Math.PI*2/8)*i; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*45, y+Math.sin(a)*45); ctx.stroke(); }
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
            } else if (type === 'sauron') {
                ctx.fillStyle = '#ff0000'; ctx.shadowBlur = 30; ctx.shadowColor = '#ff7e00'; ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffcc00'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#330000'; ctx.beginPath(); ctx.ellipse(x, y, 6, 22, 0, 0, Math.PI*2); ctx.fill();
            }
        }

        function update() {
            let cTime = getAudioTime();

            // GERADOR DE NOTAS (Matemática pura, funciona igual pros dois lados)
            if (isPlaying && cTime > 0.1) {
                if (!firstBeatInitialized) { firstBeatInitialized = true; nextBeatTime = cTime + lookAheadTime; }
                
                let spawnIntervalSec = baseBeatSec * beatMultiplier;
                while (nextBeatTime < cTime + lookAheadTime) {
                    let numNotes = (Math.random() < chordProb && maxChordNotes > 1) ? Math.floor(Math.random()*(maxChordNotes-1))+2 : 1;
                    let used = [];
                    for(let k=0; k<numNotes; k++) {
                        let avail = [0,1,2,3,4].filter(l => !used.includes(l) && laneOccupiedUntil[l] <= nextBeatTime);
                        if (!avail.length) break;
                        let l = avail[Math.floor(Math.random()*avail.length)]; used.push(l);
                        
                        let isHold = Math.random() < holdProb;
                        let dur = isHold ? (Math.random() * 1.5 + 0.5) : 0;
                        if (isHold) laneOccupiedUntil[l] = nextBeatTime + dur;

                        // Guarda estado pra renderizar na tela 1 e na tela 2
                        notes.push({ tTime: nextBeatTime, eTime: nextBeatTime + dur, dur: dur, lane: l, conf: laneConfig[l], active: [true, true], held: [false, false] });
                    }
                    nextBeatTime += spawnIntervalSec;
                }
            }

            // RENDERIZAÇÃO
            let numTelas = isOnline ? 2 : 1;
            
            for (let pIdx = 0; pIdx < numTelas; pIdx++) {
                let p = pIdx === 0 ? p1 : p2;
                let ctx = p.ctx;
                let cW = p.canvas.width; let cH = p.canvas.height;
                ctx.clearRect(0, 0, cW, cH);

                // Especial
                if (p.isPropActive) {
                    ctx.fillStyle = `rgba(0,210,255, 0.15)`; ctx.fillRect(0, 0, cW, cH);
                    if (pIdx === 0) { // Só consome barra visualmente do P1
                        p.propulsion -= 0.15; 
                        if (p.propulsion <= 0) { p.propulsion = 0; p.isPropActive = false; }
                        p.updateUI();
                    }
                }

                // Trastes
                p.fretOffset += (speedFactor/60); if (p.fretOffset > 250) p.fretOffset = 0;
                ctx.strokeStyle = p.isPropActive ? p.color : 'rgba(255,255,255,0.15)'; ctx.lineWidth = 4;
                for (let y = p.fretOffset - 250; y < cH; y += 250) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cW,y); ctx.stroke(); }

                // Cordas
                for(let i=0; i<numLanes; i++) {
                    let lX = i * p.laneWidth; let cX = lX + p.laneWidth/2;
                    ctx.strokeStyle = p.isPropActive ? p.color : 'rgba(255,255,255,0.5)'; ctx.shadowBlur=p.isPropActive?20:0; ctx.shadowColor=p.color;
                    if(i>0){ ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(lX,0); ctx.lineTo(lX,cH); ctx.stroke(); }
                    
                    // Lógica de Laser muda se é P1 (local) ou P2 (rede simulada)
                    let isActiveLane = pIdx === 0 ? p.activeKeys[i] : p2ActiveLanes[i];

                    ctx.strokeStyle = laneConfig[i].color; ctx.lineWidth = isActiveLane ? 12 : 5; ctx.shadowBlur = isActiveLane ? 30 : 0;
                    ctx.beginPath(); ctx.ellipse(cX, hitZoneY, 55, 25, 0, 0, Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0;
                    
                    if (isActiveLane) {
                        let g = ctx.createLinearGradient(0,hitZoneY,0,0); g.addColorStop(0,laneConfig[i].color); g.addColorStop(1,'transparent');
                        ctx.fillStyle = g; ctx.globalAlpha = 0.8; ctx.fillRect(lX, 0, p.laneWidth, hitZoneY); ctx.globalAlpha = 1.0;
                    }
                    if (pIdx === 0) { // Só escreve as teclas pro jogador local
                        ctx.fillStyle = p.activeKeys[i] ? '#fff' : 'rgba(255,255,255,0.5)'; ctx.font = 'bold 40px "Segoe UI"'; ctx.textAlign = 'center';
                        ctx.fillText(p.keys[i].toUpperCase(), cX, hitZoneY+12); ctx.textAlign = 'left';
                    }
                }

                // Notas
                for (let i = 0; i < notes.length; i++) {
                    let n = notes[i];
                    if (!n.active[pIdx]) continue; 
                    
                    let diff = n.tTime - cTime;
                    let nY = hitZoneY - (diff * speedFactor);
                    let nX = (n.lane * p.laneWidth) + (p.laneWidth / 2);

                    if (n.held[pIdx]) {
                        nY = hitZoneY;
                        if (pIdx === 0) { // Pontuação continua apenas pro local
                            p.score += (p.isPropActive ? p.mult*4 : p.mult*2);
                            if (cTime >= n.eTime) {
                                p.hitEffects.push({t: 'SUSTAIN!', x: nX, y: hitZoneY-60, c: n.conf.color, l: 30});
                                n.active[pIdx] = false; p.updateUI(); 
                                enviarRede({acao: 'HIT', score: p.score, combo: p.combo, lane: n.lane});
                                continue;
                            }
                        }
                    } else if (diff < -0.25) {
                        n.active[pIdx] = false; 
                        if(pIdx === 0) {
                            p.combo = 0; p.mult = 1; p.updateUI(); 
                            enviarRede({acao: 'MISS', lane: n.lane});
                        }
                        continue; 
                    }

                    if (n.dur > 0) {
                        let tailY = hitZoneY - ((n.eTime - cTime) * speedFactor);
                        let sY = n.held[pIdx] ? hitZoneY : nY;
                        if (tailY < 0) tailY = 0;
                        ctx.fillStyle = n.conf.color; ctx.globalAlpha = n.held[pIdx] ? 0.9 : 0.5;
                        ctx.beginPath(); ctx.roundRect(nX-12, tailY, 24, sY-tailY, 12); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.globalAlpha = n.held[pIdx] ? 0.8 : 0.3;
                        ctx.beginPath(); ctx.roundRect(nX-4, tailY+4, 8, sY-tailY-8, 4); ctx.fill(); ctx.globalAlpha = 1.0;
                    }

                    drawShape(ctx, n.conf.type, nX, nY, n.conf.color);
                }

                for (let i=0; i<p.hitEffects.length; i++) {
                    let e = p.hitEffects[i];
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 50px "Segoe UI"'; ctx.textAlign = 'center'; ctx.shadowBlur = 20; ctx.shadowColor = e.c;
                    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(e.t, e.x, e.y); ctx.fillText(e.t, e.x, e.y);
                    ctx.shadowBlur = 0; e.y -= 3; e.l--; if (e.l <= 0) { p.hitEffects.splice(i,1); i--; }
                }
                ctx.textAlign = 'left';
            }

            for (let i=0; i<notes.length; i++) {
                if (!notes[i].active[0] && !notes[i].active[1]) { notes.splice(i,1); i--; }
            }

            requestAnimationFrame(update);
        }

        // CONTROLES DE TECLADO LOCAIS (SOMENTE P1 ATUA NO SISTEMA AGORA)
        window.addEventListener('keydown', (e) => {
            if (e.repeat || !isPlaying) return;
            let key = e.key.toLowerCase();
            let cTime = getAudioTime();

            if (key === ' ') {
                e.preventDefault();
                if (p1.propulsion >= 100 && !p1.isPropActive) { 
                    p1.isPropActive = true; p1.updateUI(); 
                    enviarRede({acao: 'SPECIAL'}); // Manda o ataque na rede
                }
                return;
            }

            let lIdx = p1.keys.indexOf(key);
            if (lIdx !== -1 && !p1.activeKeys[lIdx]) {
                p1.activeKeys[lIdx] = true;

                for (let i=0; i<notes.length; i++) {
                    let n = notes[i];
                    if (!n.active[0] || n.lane !== lIdx) continue;
                    
                    let diff = Math.abs(n.tTime - cTime);
                    if (diff <= hitWindow) {
                        p1.combo++; 
                        if (!p1.isPropActive) p1.propulsion = Math.min(100, p1.propulsion + 3.5); 
                        
                        let pts = diff < 0.05 ? 20 : (diff < 0.1 ? 10 : 5);
                        let txt = diff < 0.05 ? 'PERFECT' : (diff < 0.1 ? 'GOOD' : 'OK');
                        
                        if (p1.combo >= 30) p1.mult = 4; else if (p1.combo >= 15) p1.mult = 3; else if (p1.combo >= 5) p1.mult = 2; else p1.mult = 1;
                        p1.score += pts * (p1.isPropActive ? p1.mult*2 : p1.mult);
                        
                        p1.hitEffects.push({t: txt, x: (lIdx*p1.laneWidth)+(p1.laneWidth/2), y: hitZoneY-60, c: p1.isPropActive ? p1.color : n.conf.color, l: 30});
                        
                        if (n.dur > 0) n.held[0] = true; else n.active[0] = false;
                        
                        p1.updateUI();
                        enviarRede({acao: 'HIT', score: p1.score, combo: p1.combo, lane: lIdx});
                        break; 
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            let lIdx = p1.keys.indexOf(key);
            if (lIdx !== -1) {
                p1.activeKeys[lIdx] = false;
                for (let i=0; i<notes.length; i++) {
                    let n = notes[i];
                    if (n.lane === lIdx && n.held[0]) {
                        if (n.eTime - getAudioTime() > 0.15) { 
                            p1.combo = 0; p1.mult = 1; p1.hitEffects.push({t: 'DROPPED', x: (lIdx*p1.laneWidth)+(p1.laneWidth/2), y: hitZoneY-60, c: '#ff0000', l: 30});
                            p1.updateUI();
                            enviarRede({acao: 'MISS', lane: lIdx});
                        }
                        n.active[0] = false; n.held[0] = false;
                    }
                }
            }
        });

        // Start
        p1.updateKeysConfig();
        setOnlineMode(false);
        setDifficulty('Médio');
        requestAnimationFrame(update);
    </script>
</body>
